<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1440" width="1920" height="1440">
  <defs>
    <linearGradient id="sereinBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FAF9F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F0EDE8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="sereinAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0A0A0A;stop-opacity:0.08" />
      <stop offset="100%" style="stop-color:#0A0A0A;stop-opacity:0.02" />
    </linearGradient>
  </defs>
  <rect width="1920" height="1440" fill="url(#sereinBg)"/>
  
  <!-- Subtle grid pattern -->
  <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
    <path d="M 60 0 L 0 0 0 60" fill="none" stroke="url(#sereinAccent)" stroke-width="0.5"/>
  </pattern>
  <rect width="1920" height="1440" fill="url(#grid)"/>
  
  <!-- Central composition -->
  <g transform="translate(960, 720)">
    <!-- Main vertical line -->
    <line x1="0" y1="-200" x2="0" y2="200" stroke="#0A0A0A" stroke-width="1" stroke-dasharray="8,16" opacity="0.3"/>
    
    <!-- Horizontal accent bars -->
    <rect x="-120" y="-160" width="240" height="1" fill="#0A0A0A" opacity="0.15"/>
    <rect x="-80" y="-40" width="160" height="1" fill="#0A0A0A" opacity="0.1"/>
    <rect x="-100" y="80" width="200" height="1" fill="#0A0A0A" opacity="0.08"/>
    <rect x="-60" y="160" width="120" height="1" fill="#0A0A0A" opacity="0.06"/>
    
    <!-- Focal point circle -->
    <circle cx="0" cy="0" r="3" fill="#0A0A0A" opacity="0.4"/>
    <circle cx="0" cy="0" r="12" fill="none" stroke="#0A0A0A" stroke-width="0.5" opacity="0.2"/>
    <circle cx="0" cy="0" r="24" fill="none" stroke="#0A0A0A" stroke-width="0.5" opacity="0.1"/>
  </g>
  
  <!-- Corner markers -->
  <g stroke="#0A0A0A" stroke-width="0.5" opacity="0.15" fill="none">
    <path d="M 80 80 h 40 M 80 80 v 40"/>
    <path d="M 1840 80 h -40 M 1840 80 v 40" transform="scale(-1,1) translate(-1920,0)"/>
    <path d="M 80 1360 h 40 M 80 1360 v -40" transform="scale(1,-1) translate(0,-1440)"/>
    <path d="M 1840 1360 h -40 M 1840 1360 v -40" transform="scale(-1,-1) translate(-1920,-1440)"/>
  </g>
  
  <!-- Label -->
  <text x="960" y="1380" font-family="system-ui, sans-serif" font-size="11" font-weight="400" 
        fill="#6B6B6B" text-anchor="middle" letter-spacing="0.3em" text-transform="uppercase">
    Serein - Fashion
  </text>
</svg>