<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1440" width="1920" height="1440">
  <defs>
    <linearGradient id="sereinBg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FAF9F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F5F2ED;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="1920" height="1440" fill="url(#sereinBg3)"/>
  
  <!-- E-commerce interface layout -->
  <g transform="translate(960, 720)">
    <!-- Header bar -->
    <rect x="-400" y="-280" width="800" height="50" rx="4" fill="#0A0A0A" opacity="0.08"/>
    <rect x="-380" y="-265" width="60" height="20" rx="2" fill="#0A0A0A" opacity="0.15"/>
    <rect x="220" y="-265" width="80" height="20" rx="2" fill="#0A0A0A" opacity="0.1"/>
    <rect x="320" y="-265" width="60" height="20" rx="2" fill="#0A0A0A" opacity="0.1"/>
    
    <!-- Product grid -->
    <g fill="#0A0A0A" opacity="0.08">
      <rect x="-360" y="-180" width="220" height="280" rx="4"/>
      <rect x="-120" y="-180" width="220" height="280" rx="4"/>
      <rect x="120" y="-180" width="220" height="280" rx="4"/>
      
      <rect x="-360" y="120" width="220" height="280" rx="4" opacity="0.06"/>
      <rect x="-120" y="120" width="220" height="280" rx="4" opacity="0.06"/>
      <rect x="120" y="120" width="220" height="280" rx="4" opacity="0.06"/>
    </g>
    
    <!-- Product image placeholders -->
    <g fill="#0A0A0A" opacity="0.12">
      <rect x="-340" y="-160" width="180" height="180" rx="2"/>
      <rect x="-100" y="-160" width="180" height="180" rx="2"/>
      <rect x="140" y="-160" width="180" height="180" rx="2"/>
    </g>
    
    <!-- Product titles -->
    <g fill="#0A0A0A" opacity="0.15">
      <rect x="-340" y="30" width="140" height="12" rx="2"/>
      <rect x="-340" y="50" width="100" height="8" rx="2" opacity="0.6"/>
      
      <rect x="-100" y="30" width="140" height="12" rx="2"/>
      <rect x="-100" y="50" width="100" height="8" rx="2" opacity="0.6"/>
      
      <rect x="140" y="30" width="140" height="12" rx="2"/>
      <rect x="140" y="50" width="100" height="8" rx="2" opacity="0.6"/>
    </g>
    
    <!-- Prices -->
    <g fill="#0A0A0A" opacity="0.2">
      <rect x="-340" y="70" width="60" height="14" rx="2"/>
      <rect x="-100" y="70" width="60" height="14" rx="2"/>
      <rect x="140" y="70" width="60" height="14" rx="2"/>
    </g>
  </g>
  
  <g stroke="#0A0A0A" stroke-width="0.5" opacity="0.12" fill="none">
    <path d="M 80 80 h 40 M 80 80 v 40"/>
    <path d="M 1840 80 h -40 M 1840 80 v 40" transform="scale(-1,1) translate(-1920,0)"/>
    <path d="M 80 1360 h 40 M 80 1360 v -40" transform="scale(1,-1) translate(0,-1440)"/>
    <path d="M 1840 1360 h -40 M 1840 1360 v -40" transform="scale(-1,-1) translate(-1920,-1440)"/>
  </g>
  
  <text x="960" y="1380" font-family="system-ui, sans-serif" font-size="11" font-weight="400" 
        fill="#6B6B6B" text-anchor="middle" letter-spacing="0.3em" text-transform="uppercase">
    Serein - Interface
  </text>
</svg>