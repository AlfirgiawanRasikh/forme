<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1440" width="1920" height="1440">
  <defs>
    <linearGradient id="sereinBg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FAF9F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E8E4DD;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="1920" height="1440" fill="url(#sereinBg2)"/>
  
  <!-- Texture pattern -->
  <pattern id="fabric" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M0,20 Q20,0 40,20 Q20,40 0,20" fill="none" stroke="#0A0A0A" stroke-width="0.3" opacity="0.05"/>
  </pattern>
  <rect width="1920" height="1440" fill="url(#fabric)"/>
  
  <!-- Identity composition -->
  <g transform="translate(960, 720)">
    <!-- Typography block representation -->
    <rect x="-180" y="-90" width="360" height="4" fill="#0A0A0A" opacity="0.6"/>
    <rect x="-140" y="-70" width="280" height="2" fill="#0A0A0A" opacity="0.3"/>
    <rect x="-160" y="-40" width="320" height="2" fill="#0A0A0A" opacity="0.2"/>
    <rect x="-120" y="-10" width="240" height="2" fill="#0A0A0A" opacity="0.15"/>
    
    <!-- Divider -->
    <line x1="-100" y1="30" x2="100" y2="30" stroke="#0A0A0A" stroke-width="1" opacity="0.2"/>
    
    <!-- Logo mark -->
    <g>
      <rect x="-8" y="-8" width="16" height="16" fill="none" stroke="#0A0A0A" stroke-width="1.5" opacity="0.5"/>
      <rect x="-4" y="-4" width="8" height="8" fill="#0A0A0A" opacity="0.4"/>
    </g>
    
    <!-- Tagline area -->
    <rect x="-200" y="60" width="400" height="1" fill="#0A0A0A" opacity="0.1"/>
    <rect x="-150" y="80" width="300" height="1.5" fill="#0A0A0A" opacity="0.08"/>
  </g>
  
  <!-- Corner markers -->
  <g stroke="#0A0A0A" stroke-width="0.5" opacity="0.12" fill="none">
    <path d="M 80 80 h 40 M 80 80 v 40"/>
    <path d="M 1840 80 h -40 M 1840 80 v 40" transform="scale(-1,1) translate(-1920,0)"/>
    <path d="M 80 1360 h 40 M 80 1360 v -40" transform="scale(1,-1) translate(0,-1440)"/>
    <path d="M 1840 1360 h -40 M 1840 1360 v -40" transform="scale(-1,-1) translate(-1920,-1440)"/>
  </g>
  
  <text x="960" y="1380" font-family="system-ui, sans-serif" font-size="11" font-weight="400" 
        fill="#6B6B6B" text-anchor="middle" letter-spacing="0.3em" text-transform="uppercase">
    Serein — Identity
  </text>
</svg>