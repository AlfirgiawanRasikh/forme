<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1440" width="1920" height="1440">
  <defs>
    <linearGradient id="sereinBg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FAF9F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F0EDE8;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="1920" height="1440" fill="url(#sereinBg5)"/>
  
  <!-- Detail/Fabric texture close-up -->
  <defs>
    <pattern id="weave" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M0,12 L24,12 M12,0 L12,24" stroke="#0A0A0A" stroke-width="0.2" opacity="0.03"/>
    </pattern>
    <pattern id="thread" width="8" height="80" patternUnits="userSpaceOnUse">
      <line x1="4" y1="0" x2="4" y2="80" stroke="#0A0A0A" stroke-width="0.5" opacity="0.04" stroke-dasharray="2,2"/>
    </pattern>
  </defs>
  <rect width="1920" height="1440" fill="url(#weave)"/>
  <rect width="1920" height="1440" fill="url(#thread)" transform="rotate(15 960 720)"/>
  
  <!-- Central focus area -->
  <g transform="translate(960, 720)">
    <!-- Macro detail circles -->
    <circle cx="-100" cy="-80" r="40" fill="none" stroke="#0A0A0A" stroke-width="1" opacity="0.15"/>
    <circle cx="-100" cy="-80" r="30" fill="none" stroke="#0A0A0A" stroke-width="0.5" opacity="0.1"/>
    <circle cx="-100" cy="-80" r="20" fill="none" stroke="#0A0A0A" stroke-width="0.3" opacity="0.08"/>
    <circle cx="-100" cy="-80" r="8" fill="#0A0A0A" opacity="0.3"/>
    
    <circle cx="100" cy="80" r="35" fill="none" stroke="#0A0A0A" stroke-width="1" opacity="0.12"/>
    <circle cx="100" cy="80" r="25" fill="none" stroke="#0A0A0A" stroke-width="0.5" opacity="0.08"/>
    <circle cx="100" cy="80" r="15" fill="none" stroke="#0A0A0A" stroke-width="0.3" opacity="0.06"/>
    <circle cx="100" cy="80" r="6" fill="#0A0A0A" opacity="0.25"/>
    
    <!-- Detail lines -->
    <g stroke="#0A0A0A" stroke-width="0.5" opacity="0.1">
      <path d="M -200 -150 Q -50 -50 100 50"/>
      <path d="M 200 -150 Q 50 -50 -100 50"/>
    </g>
    
    <!-- Measurement indicators -->
    <g stroke="#0A0A0A" stroke-width="0.5" opacity="0.15" fill="none">
      <path d="M -180 -180 h 40 M -180 -180 v 40"/>
      <path d="M 140 -180 h -40 M 140 -180 v 40" transform="scale(-1,1) translate(-320,0)"/>
      <path d="M -180 100 h 40 M -180 100 v -40" transform="scale(1,-1) translate(0,-160)"/>
      <path d="M 140 100 h -40 M 140 100 v -40" transform="scale(-1,-1) translate(-320,-160)"/>
    </g>
    
    <!-- Scale reference -->
    <line x1="-60" y1="160" x2="60" y2="160" stroke="#0A0A0A" stroke-width="1" opacity="0.2"/>
    <line x1="-60" y1="155" x2="-60" y2="165" stroke="#0A0A0A" stroke-width="1" opacity="0.2"/>
    <line x1="60" y1="155" x2="60" y2="165" stroke="#0A0A0A" stroke-width="1" opacity="0.2"/>
    <text x="0" y="185" font-family="system-ui, sans-serif" font-size="9" fill="#6B6B6B" text-anchor="middle" opacity="0.5">1 cm</text>
  </g>
  
  <g stroke="#0A0A0A" stroke-width="0.5" opacity="0.12" fill="none">
    <path d="M 80 80 h 40 M 80 80 v 40"/>
    <path d="M 1840 80 h -40 M 1840 80 v 40" transform="scale(-1,1) translate(-1920,0)"/>
    <path d="M 80 1360 h 40 M 80 1360 v -40" transform="scale(1,-1) translate(0,-1440)"/>
    <path d="M 1840 1360 h -40 M 1840 1360 v -40" transform="scale(-1,-1) translate(-1920,-1440)"/>
  </g>
  
  <text x="960" y="1380" font-family="system-ui, sans-serif" font-size="11" font-weight="400" 
        fill="#6B6B6B" text-anchor="middle" letter-spacing="0.3em" text-transform="uppercase">
    Serein — Detail
  </text>
</svg>