<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1440" width="1920" height="1440">
  <defs>
    <linearGradient id="sereinBg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FAF9F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#EDEAE4;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="1920" height="1440" fill="url(#sereinBg4)"/>
  
  <!-- Mobile/Detail view -->
  <g transform="translate(960, 720)">
    <!-- Phone frame -->
    <rect x="-160" y="-300" width="320" height="560" rx="24" fill="#0A0A0A" opacity="0.06" stroke="#0A0A0A" stroke-width="1" opacity="0.1"/>
    <rect x="-150" y="-290" width="300" height="540" rx="16" fill="#FAF9F6"/>
    
    <!-- Status bar -->
    <rect x="-130" y="-270" width="260" height="20" fill="#0A0A0A" opacity="0.05"/>
    <circle cx="0" cy="-260" r="4" fill="#0A0A0A" opacity="0.1"/>
    
    <!-- Product detail -->
    <rect x="-100" y="-230" width="200" height="200" rx="4" fill="#0A0A0A" opacity="0.08"/>
    <rect x="-80" y="-210" width="160" height="160" rx="2" fill="#0A0A0A" opacity="0.12"/>
    
    <!-- Product info -->
    <rect x="-120" y="-10" width="240" height="16" rx="2" fill="#0A0A0A" opacity="0.2"/>
    <rect x="-120" y="12" width="180" height="10" rx="2" fill="#0A0A0A" opacity="0.12"/>
    <rect x="-120" y="30" width="100" height="14" rx="2" fill="#0A0A0A" opacity="0.25"/>
    
    <!-- Description -->
    <g fill="#0A0A0A" opacity="0.15">
      <rect x="-120" y="60" width="240" height="8" rx="2"/>
      <rect x="-120" y="75" width="240" height="8" rx="2" opacity="0.7"/>
      <rect x="-120" y="90" width="180" height="8" rx="2" opacity="0.6"/>
      <rect x="-120" y="105" width="200" height="8" rx="2" opacity="0.7"/>
    </g>
    
    <!-- Size selector -->
    <rect x="-120" y="140" width="240" height="10" rx="2" fill="#0A0A0A" opacity="0.15"/>
    <g fill="#0A0A0A" opacity="0.2">
      <rect x="-110" y="160" width="40" height="30" rx="4"/>
      <rect x="-55" y="160" width="40" height="30" rx="4"/>
      <rect x="0" y="160" width="40" height="30" rx="4"/>
      <rect x="55" y="160" width="40" height="30" rx="4"/>
      <rect x="110" y="160" width="40" height="30" rx="4"/>
    </g>
    
    <!-- Add to cart -->
    <rect x="-120" y="220" width="240" height="44" rx="8" fill="#0A0A0A" opacity="0.3"/>
    <rect x="-120" y="280" width="240" height="36" rx="8" fill="none" stroke="#0A0A0A" stroke-width="1" opacity="0.15"/>
  </g>
  
  <g stroke="#0A0A0A" stroke-width="0.5" opacity="0.12" fill="none">
    <path d="M 80 80 h 40 M 80 80 v 40"/>
    <path d="M 1840 80 h -40 M 1840 80 v 40" transform="scale(-1,1) translate(-1920,0)"/>
    <path d="M 80 1360 h 40 M 80 1360 v -40" transform="scale(1,-1) translate(0,-1440)"/>
    <path d="M 1840 1360 h -40 M 1840 1360 v -40" transform="scale(-1,-1) translate(-1920,-1440)"/>
  </g>
  
  <text x="960" y="1380" font-family="system-ui, sans-serif" font-size="11" font-weight="400" 
        fill="#6B6B6B" text-anchor="middle" letter-spacing="0.3em" text-transform="uppercase">
    Serein — Interface 2
  </text>
</svg>