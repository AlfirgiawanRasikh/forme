<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1440" width="1920" height="1440">
  <defs>
    <linearGradient id="velaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D0D0D;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#141414;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0A0A0A;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="velaSpotlight" cx="50%" cy="30%" r="60%">
      <stop offset="0%" style="stop-color:#FF3366;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#FF3366;stop-opacity:0" />
    </radialGradient>
  </defs>
  <rect width="1920" height="1440" fill="url(#velaBg)"/>
  <rect width="1920" height="1440" fill="url(#velaSpotlight)"/>
  
  <!-- Noise texture -->
  <pattern id="noise" width="64" height="64" patternUnits="userSpaceOnUse">
    <rect width="64" height="64" fill="#000"/>
    <circle cx="32" cy="32" r="1" fill="#FF3366" opacity="0.02"/>
  </pattern>
  <rect width="1920" height="1440" fill="url(#noise)" opacity="0.03"/>
  
  <!-- Dynamic composition -->
  <g transform="translate(960, 720)">
    <!-- Central focal burst -->
    <g opacity="0.3">
      <circle cx="0" cy="0" r="200" fill="none" stroke="#FF3366" stroke-width="0.5" stroke-dasharray="10,20"/>
      <circle cx="0" cy="0" r="150" fill="none" stroke="#FF3366" stroke-width="0.5" stroke-dasharray="5,15"/>
      <circle cx="0" cy="0" r="100" fill="none" stroke="#FF3366" stroke-width="0.5" stroke-dasharray="3,10"/>
      <circle cx="0" cy="0" r="50" fill="none" stroke="#FF3366" stroke-width="1" opacity="0.5"/>
    </g>
    
    <!-- Typographic bars -->
    <g fill="#FFFFFF" opacity="0.15">
      <rect x="-300" y="-200" width="600" height="3" rx="1.5"/>
      <rect x="-250" y="-150" width="500" height="2" rx="1" opacity="0.8"/>
      <rect x="-200" y="-100" width="400" height="2" rx="1" opacity="0.6"/>
      <rect x="-150" y="-50" width="300" height="2" rx="1" opacity="0.5"/>
      <rect x="-100" y="0" width="200" height="2" rx="1" opacity="0.4"/>
      <rect x="-120" y="50" width="240" height="2" rx="1" opacity="0.3"/>
      <rect x="-140" y="100" width="280" height="2" rx="1" opacity="0.2"/>
      <rect x="-160" y="150" width="320" height="2" rx="1" opacity="0.15"/>
      <rect x="-180" y="200" width="360" height="2" rx="1" opacity="0.1"/>
    </g>
    
    <!-- Accent lines -->
    <g stroke="#FF3366" stroke-width="1" opacity="0.3">
      <line x1="-400" y1="-200" x2="400" y2="-200"/>
      <line x1="-300" y1="200" x2="300" y2="200"/>
    </g>
    
    <!-- Central dot -->
    <circle cx="0" cy="0" r="4" fill="#FF3366" opacity="0.8"/>
    <circle cx="0" cy="0" r="12" fill="none" stroke="#FF3366" stroke-width="1" opacity="0.3"/>
  </g>
  
  <!-- Corner markers -->
  <g stroke="#FFFFFF" stroke-width="0.5" opacity="0.08" fill="none">
    <path d="M 80 80 h 40 M 80 80 v 40"/>
    <path d="M 1840 80 h -40 M 1840 80 v 40" transform="scale(-1,1) translate(-1920,0)"/>
    <path d="M 80 1360 h 40 M 80 1360 v -40" transform="scale(1,-1) translate(0,-1440)"/>
    <path d="M 1840 1360 h -40 M 1840 1360 v -40" transform="scale(-1,-1) translate(-1920,-1440)"/>
  </g>
  
  <text x="960" y="1380" font-family="system-ui, sans-serif" font-size="11" font-weight="400" 
        fill="#FFFFFF" text-anchor="middle" letter-spacing="0.3em" text-transform="uppercase" opacity="0.3">
    Vela - Music &amp; Culture
  </text>
</svg>