<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1440" width="1920" height="1440">
  <defs>
    <linearGradient id="velaBg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D0D0D;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1A1A1A;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="1920" height="1440" fill="url(#velaBg2)"/>
  
  <!-- Noise -->
  <pattern id="velaNoise" width="32" height="32" patternUnits="userSpaceOnUse">
    <rect width="32" height="32" fill="#000"/>
    <circle cx="16" cy="16" r="0.5" fill="#FF3366" opacity="0.03"/>
  </pattern>
  <rect width="1920" height="1440" fill="url(#velaNoise)" opacity="0.05"/>
  
  <!-- Identity system -->
  <g transform="translate(960, 720)">
    <!-- Logo mark -->
    <g>
      <!-- V E L A letters as geometric forms -->
      <rect x="-120" y="-80" width="10" height="100" fill="#FF3366" opacity="0.8"/>
      <rect x="-100" y="-30" width="80" height="10" fill="#FFFFFF" opacity="0.6"/>
      <rect x="-100" y="10" width="60" height="10" fill="#FFFFFF" opacity="0.5"/>
      <rect x="-100" y="50" width="70" height="10" fill="#FFFFFF" opacity="0.4"/>
      
      <rect x="20" y="-80" width="10" height="100" fill="#FFFFFF" opacity="0.6"/>
      <rect x="40" y="-80" width="80" height="10" fill="#FFFFFF" opacity="0.4"/>
      <rect x="40" y="10" width="80" height="10" fill="#FF3366" opacity="0.8"/>
    </g>
    
    <!-- Divider -->
    <line x1="-200" y1="40" x2="200" y2="40" stroke="#FF3366" stroke-width="1" opacity="0.4"/>
    
    <!-- Color palette -->
    <g transform="translate(-150, 100)">
      <rect x="0" y="0" width="60" height="60" rx="4" fill="#FF3366"/>
      <rect x="75" y="0" width="60" height="60" rx="4" fill="#00FF88"/>
      <rect x="150" y="0" width="60" height="60" rx="4" fill="#FFFFFF"/>
      <rect x="225" y="0" width="60" height="60" rx="4" fill="#0A0A0A" stroke="#333" stroke-width="1"/>
    </g>
    
    <!-- Typography scale -->
    <g fill="#FFFFFF" opacity="0.6" font-family="system-ui, sans-serif" font-weight="600" text-anchor="middle">
      <text x="0" y="220" font-size="48" font-weight="700" fill="#FF3366">VELA</text>
      <text x="0" y="280" font-size="24" opacity="0.5">Music &amp; Culture Platform</text>
      <text x="0" y="320" font-size="14" opacity="0.3">Brand Identity System</text>
    </g>
    
    <!-- Grid system indicator -->
    <g stroke="#FFFFFF" stroke-width="0.3" opacity="0.1" fill="none">
      <rect x="-200" y="360" width="400" height="40" rx="2"/>
      <line x1="0" y1="360" x2="0" y2="400"/>
      <line x1="-100" y1="360" x2="-100" y2="400"/>
      <line x1="100" y1="360" x2="100" y2="400"/>
    </g>
  </g>
  
  <g stroke="#FFFFFF" stroke-width="0.5" opacity="0.06" fill="none">
    <path d="M 80 80 h 40 M 80 80 v 40"/>
    <path d="M 1840 80 h -40 M 1840 80 v 40" transform="scale(-1,1) translate(-1920,0)"/>
    <path d="M 80 1360 h 40 M 80 1360 v -40" transform="scale(1,-1) translate(0,-1440)"/>
    <path d="M 1840 1360 h -40 M 1840 1360 v -40" transform="scale(-1,-1) translate(-1920,-1440)"/>
  </g>
  
  <text x="960" y="1380" font-family="system-ui, sans-serif" font-size="11" font-weight="400" 
        fill="#FFFFFF" text-anchor="middle" letter-spacing="0.3em" text-transform="uppercase" opacity="0.3">
    Vela - Identity
  </text>
</svg>