<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1440" width="1920" height="1440">
  <defs>
    <linearGradient id="velaBg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D0D0D;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0F0F0F;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="1920" height="1440" fill="url(#velaBg4)"/>
  
  <pattern id="velaNoise2" width="24" height="24" patternUnits="userSpaceOnUse">
    <rect width="24" height="24" fill="#000"/>
    <circle cx="12" cy="12" r="0.5" fill="#00FF88" opacity="0.02"/>
  </pattern>
  <rect width="1920" height="1440" fill="url(#velaNoise2)" opacity="0.04"/>
  
  <!-- Mobile/Article view -->
  <g transform="translate(960, 720)">
    <!-- Phone frame -->
    <rect x="-160" y="-300" width="320" height="560" rx="24" fill="#FFFFFF" opacity="0.03" stroke="#FFFFFF" stroke-width="1" opacity="0.05"/>
    <rect x="-150" y="-290" width="300" height="540" rx="16" fill="#0D0D0D"/>
    
    <!-- Status bar -->
    <rect x="-130" y="-270" width="260" height="20" fill="#FF3366" opacity="0.1"/>
    
    <!-- Article header -->
    <rect x="-120" y="-250" width="240" height="4" rx="2" fill="#00FF88" opacity="0.4"/>
    <rect x="-120" y="-235" width="240" height="16" rx="2" fill="#FFFFFF" opacity="0.2"/>
    <rect x="-120" y="-210" width="180" height="10" rx="2" fill="#FFFFFF" opacity="0.12"/>
    
    <!-- Hero image -->
    <rect x="-120" y="-180" width="240" height="180" rx="4" fill="#FF3366" opacity="0.2"/>
    <rect x="-100" y="-160" width="200" height="140" rx="2" fill="#FF3366" opacity="0.3"/>
    
    <!-- Article content -->
    <g fill="#FFFFFF" opacity="0.15">
      <rect x="-120" y="-20" width="240" height="12" rx="2"/>
      <rect x="-120" y="-5" width="240" height="8" rx="2" opacity="0.7"/>
      <rect x="-120" y="5" width="240" height="8" rx="2" opacity="0.7"/>
      <rect x="-120" y="15" width="240" height="8" rx="2" opacity="0.6"/>
      <rect x="-120" y="25" width="180" height="8" rx="2" opacity="0.6"/>
      <rect x="-120" y="35" width="240" height="8" rx="2" opacity="0.7"/>
      <rect x="-120" y="45" width="240" height="8" rx="2" opacity="0.6"/>
      <rect x="-120" y="55" width="200" height="8" rx="2" opacity="0.5"/>
    </g>
    
    <!-- Quote highlight -->
    <rect x="-120" y="80" width="240" height="60" rx="4" fill="#FF3366" opacity="0.1" stroke="#FF3366" stroke-width="0.5" opacity="0.2"/>
    <line x1="-100" y1="90" x2="100" y2="90" stroke="#00FF88" stroke-width="1" opacity="0.4"/>
    <rect x="-100" y="100" width="160" height="8" rx="2" fill="#FFFFFF" opacity="0.1"/>
    <rect x="-100" y="112" width="120" height="8" rx="2" fill="#FFFFFF" opacity="0.08"/>
    
    <!-- More content -->
    <g fill="#FFFFFF" opacity="0.1">
      <rect x="-120" y="160" width="240" height="8" rx="2"/>
      <rect x="-120" y="172" width="240" height="8" rx="2" opacity="0.7"/>
      <rect x="-120" y="184" width="240" height="8" rx="2" opacity="0.6"/>
      <rect x="-120" y="196" width="180" height="8" rx="2" opacity="0.6"/>
    </g>
    
    <!-- Audio player mini -->
    <rect x="-120" y="230" width="240" height="50" rx="8" fill="#FF3366" opacity="0.15" stroke="#FF3366" stroke-width="0.5" opacity="0.2"/>
    <rect x="-100" y="240" width="30" height="30" rx="4" fill="#FF3366" opacity="0.4"/>
    <rect x="-55" y="245" width="120" height="8" rx="2" fill="#FFFFFF" opacity="0.15"/>
    <rect x="-55" y="257" width="80" height="6" rx="2" fill="#FFFFFF" opacity="0.1"/>
    <rect x="140" y="247" width="20" height="16" rx="2" fill="#00FF88" opacity="0.4"/>
    
    <!-- Nav bar -->
    <rect x="-150" y="210" width="300" height="1" fill="#FFFFFF" opacity="0.05"/>
  </g>
  
  <g stroke="#FFFFFF" stroke-width="0.5" opacity="0.05" fill="none">
    <path d="M 80 80 h 40 M 80 80 v 40"/>
    <path d="M 1840 80 h -40 M 1840 80 v 40" transform="scale(-1,1) translate(-1920,0)"/>
    <path d="M 80 1360 h 40 M 80 1360 v -40" transform="scale(1,-1) translate(0,-1440)"/>
    <path d="M 1840 1360 h -40 M 1840 1360 v -40" transform="scale(-1,-1) translate(-1920,-1440)"/>
  </g>
  
  <text x="960" y="1380" font-family="system-ui, sans-serif" font-size="11" font-weight="400" 
        fill="#FFFFFF" text-anchor="middle" letter-spacing="0.3em" text-transform="uppercase" opacity="0.3">
    Vela — Interface 2
  </text>
</svg>